<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Balutan ni Arnel</title>
<meta name="theme-color" content="#1C1108">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Balutan POS">
<link rel="manifest" href="manifest.json">
<link rel="icon apple-touch-icon" type="image/png" href="icon-192.png">
<style>
  :root{
    --broth:#1C1108;
    --broth-2:#2C1A0E;
    --cream:#FFF8E9;
    --panel:#FFFFFF;
    --panel-soft:#FFFCF5;
    --line:#EEDFC0;
    --line-soft:#F4E9CE;
    --chili:#C41411;
    --chili-dark:#8F0E0C;
    --chili-glow:rgba(196,20,17,0.28);
    --yolk:#FFC72C;
    --yolk-dark:#E0A400;
    --herb:#12872B;
    --herb-dark:#0C651F;
    --muted2:#9C8E76;
    --muted3:#C7B78F;
    --radius:16px;
    --radius-lg:22px;
    --radius-sm:10px;
    --shadow-sm:0 2px 6px rgba(43,27,18,0.07);
    --shadow-md:0 8px 22px rgba(43,27,18,0.12);
    --shadow-lg:0 18px 44px rgba(28,17,8,0.28);
    --disp: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "Courier New", monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; color:var(--broth);
    font-family:var(--disp);
    display:flex; flex-direction:column;
    overflow:hidden;
    background:
      radial-gradient(circle at 100% 0%, rgba(255,199,44,0.10), transparent 45%),
      radial-gradient(circle at 0% 100%, rgba(196,20,17,0.06), transparent 40%),
      var(--cream);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit; cursor:pointer;}
  button:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--chili); outline-offset:2px;
  }
  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--muted3); border-radius:8px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--muted2);}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ---------- HEADER ---------- */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 24px; color:var(--cream);
    background:linear-gradient(155deg, var(--broth-2), var(--broth) 65%);
    flex-shrink:0; z-index:20; gap:10px; flex-wrap:wrap;
    box-shadow:0 4px 16px rgba(0,0,0,0.28);
    position:relative;
  }
  header::after{
    content:""; position:absolute; left:0; right:0; bottom:-3px; height:3px;
    background:linear-gradient(90deg, var(--chili), var(--yolk), var(--herb));
    opacity:0.9;
  }
  .brand{display:flex; align-items:center; gap:13px;}
  .brand-logo{
    width:46px; height:46px; border-radius:50%; object-fit:cover; flex-shrink:0;
    border:2px solid var(--yolk); box-shadow:0 0 0 2px var(--chili), var(--shadow-sm);
  }
  .brand-text h1{margin:0; font-size:19px; font-weight:900; letter-spacing:0.3px; text-transform:uppercase;}
  .brand-text p{margin:0; font-size:10.5px; color:var(--yolk); letter-spacing:1.5px; text-transform:uppercase; font-weight:600;}
  .head-actions{display:flex; align-items:center; gap:9px; flex-wrap:wrap;}
  .head-btn{
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18);
    color:var(--cream); border-radius:11px; padding:9px 14px; font-size:12.5px; font-weight:700;
    display:flex; align-items:center; gap:6px; white-space:nowrap;
    transition:background .15s ease, transform .12s ease, border-color .15s ease;
    backdrop-filter:blur(4px);
  }
  .head-btn:hover{background:rgba(255,255,255,0.17); border-color:rgba(255,255,255,0.3);}
  .head-btn:active{transform:scale(0.95);}
  .clock{font-family:var(--mono); font-size:12.5px; color:var(--muted3); margin-right:2px; display:none; letter-spacing:.3px;}
  @media(min-width:900px){.clock{display:block;}}
  .lock-badge{font-size:10px; opacity:.75; margin-left:2px;}

  /* ---------- LAYOUT ---------- */
  .app{flex:1; display:flex; min-height:0;}
  .menu-side{flex:1; display:flex; flex-direction:column; min-width:0;}
  .tabs{display:flex; gap:8px; padding:16px 20px 0; flex-shrink:0; overflow-x:auto;}
  .tab{
    border:1.5px solid var(--line); background:var(--panel); padding:9px 17px; border-radius:999px;
    font-weight:700; font-size:13px; color:var(--muted2); white-space:nowrap;
    transition:all .15s ease; box-shadow:var(--shadow-sm);
  }
  .tab:hover{border-color:var(--chili); color:var(--chili-dark);}
  .tab.active{background:var(--chili); color:#fff; border-color:var(--chili); box-shadow:0 4px 12px var(--chili-glow);}
  .tab.tab-fav{border-color:var(--yolk-dark); color:var(--yolk-dark); font-weight:800;}
  .tab.tab-fav.active{background:var(--yolk); color:var(--broth); border-color:var(--yolk-dark); box-shadow:0 4px 12px rgba(255,199,44,0.45);}

  .grid-wrap{flex:1; overflow-y:auto; padding:16px 20px 90px; scroll-behavior:smooth;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(152px,1fr)); gap:13px;}
  .item-card{
    background:var(--panel); border:1.5px solid var(--line); border-radius:var(--radius);
    padding:15px; text-align:left; display:flex; flex-direction:column; gap:10px;
    min-height:98px; position:relative; transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    box-shadow:var(--shadow-sm);
  }
  .item-card:hover{box-shadow:var(--shadow-md); border-color:var(--muted3); transform:translateY(-2px);}
  .item-card:active{transform:scale(0.96) translateY(0);}
  .item-card.soldout{opacity:0.45; pointer-events:none;}
  .item-name{font-weight:800; font-size:14.5px; line-height:1.25;}
  .item-note{font-size:11px; color:var(--muted2); line-height:1.3; margin-top:-4px;}
  .item-price{font-family:var(--mono); font-weight:700; color:var(--chili); font-size:14px;}
  .item-card .plus{
    position:absolute; top:10px; right:10px; width:23px; height:23px; border-radius:50%;
    background:var(--herb); color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:900; line-height:1; box-shadow:0 3px 8px rgba(18,135,43,0.4);
    transition:transform .12s ease;
  }
  .item-card:hover .plus{transform:scale(1.12) rotate(90deg);}
  .fav-badge{position:absolute; top:10px; left:10px; font-size:13px; filter:drop-shadow(0 1px 1px rgba(0,0,0,0.25));}
  .soldout-badge{
    position:absolute; top:10px; right:10px; background:var(--chili); color:#fff; font-size:9px;
    font-weight:800; padding:3px 7px; border-radius:6px; letter-spacing:.5px;
  }
  .empty-menu{padding:40px; text-align:center; color:var(--muted2); font-size:14px;}

  /* ---------- ORDER TICKET ---------- */
  .ticket-col{
    width:360px; flex-shrink:0;
    background:linear-gradient(180deg, #F6ECD8, #F0E3C7);
    border-left:2px dashed var(--line);
    display:flex; flex-direction:column; min-height:0;
  }
  .ticket-tabs{display:flex; gap:6px; padding:12px 12px 0; overflow-x:auto; flex-shrink:0;}
  .tticket-tab{
    background:var(--panel); border:1.5px solid var(--line); border-radius:9px; padding:7px 11px;
    font-size:11.5px; font-weight:700; color:var(--muted2); white-space:nowrap; display:flex; align-items:center; gap:6px;
    transition:all .15s ease; box-shadow:var(--shadow-sm);
  }
  .tticket-tab.active{background:var(--broth); color:var(--cream); border-color:var(--broth); box-shadow:var(--shadow-md);}
  .tticket-tab .cnt{background:var(--chili); color:#fff; border-radius:999px; font-size:9.5px; padding:1px 5px; font-weight:800;}
  .tticket-tab.active .cnt{background:var(--yolk); color:var(--broth);}
  .ticket-tab-close{font-size:12px; margin-left:2px; opacity:.7;}
  .ticket-tab-add{
    background:var(--herb); color:#fff; border:none; border-radius:9px; padding:7px 12px; font-size:14px; font-weight:900;
    box-shadow:0 3px 8px rgba(18,135,43,0.35); transition:transform .12s ease;
  }
  .ticket-tab-add:active{transform:scale(0.92);}
  .ticket-tab-clear{
    background:var(--panel); color:var(--chili); border:1.5px solid var(--chili); border-radius:9px; padding:7px 10px; font-size:13px;
    transition:background .15s ease;
  }
  .ticket-tab-clear:hover{background:#FCEBEA;}

  .ticket{
    margin:12px 16px 16px; background:var(--panel-soft); flex:1; display:flex; flex-direction:column;
    min-height:0; box-shadow:var(--shadow-lg);
    background-image:repeating-linear-gradient(180deg, rgba(28,17,8,0.015) 0px, rgba(28,17,8,0.015) 1px, transparent 1px, transparent 34px);
    clip-path: polygon(
      0% 8px, 3% 0%, 6% 8px, 9% 0%, 12% 8px, 15% 0%, 18% 8px, 21% 0%, 24% 8px, 27% 0%, 30% 8px, 33% 0%, 36% 8px, 39% 0%, 42% 8px, 45% 0%, 48% 8px, 51% 0%, 54% 8px, 57% 0%, 60% 8px, 63% 0%, 66% 8px, 69% 0%, 72% 8px, 75% 0%, 78% 8px, 81% 0%, 84% 8px, 87% 0%, 90% 8px, 93% 0%, 96% 8px, 100% 0%,
      100% calc(100% - 8px), 97% 100%, 94% calc(100% - 8px), 91% 100%, 88% calc(100% - 8px), 85% 100%, 82% calc(100% - 8px), 79% 100%, 76% calc(100% - 8px), 73% 100%, 70% calc(100% - 8px), 67% 100%, 64% calc(100% - 8px), 61% 100%, 58% calc(100% - 8px), 55% 100%, 52% calc(100% - 8px), 49% 100%, 46% calc(100% - 8px), 43% 100%, 40% calc(100% - 8px), 37% 100%, 34% calc(100% - 8px), 31% 100%, 28% calc(100% - 8px), 25% 100%, 22% calc(100% - 8px), 19% 100%, 16% calc(100% - 8px), 13% 100%, 10% calc(100% - 8px), 7% 100%, 4% calc(100% - 8px), 0% 100%
    );
  }
  .ticket-head{padding:18px 20px 10px; text-align:center; flex-shrink:0; border-bottom:1px dashed var(--line);}
  .ticket-head .name{font-weight:900; letter-spacing:1.2px; text-transform:uppercase; font-size:14px;}
  .ticket-head .sub{font-family:var(--mono); font-size:11px; color:var(--muted2); margin-top:4px;}
  .table-row{display:flex; justify-content:center; margin-bottom:10px;}
  .table-input{
    width:100%; max-width:260px; text-align:center; font-family:var(--disp); font-weight:800;
    font-size:15px; letter-spacing:.5px; color:var(--broth); background:var(--yolk);
    border:1.5px solid var(--broth); border-radius:11px; padding:10px 10px;
    box-shadow:var(--shadow-sm); transition:box-shadow .15s ease;
  }
  .table-input::placeholder{color:#6b5a2a; font-weight:700;}
  .table-input:focus{outline:2px solid var(--chili); outline-offset:1px; box-shadow:var(--shadow-md);}
  .ticket-hint{font-size:10.5px; color:var(--muted2); text-align:center; margin-top:8px; line-height:1.4;}
  .pill-group{display:flex; gap:6px; justify-content:center; margin-top:10px; flex-wrap:wrap;}
  .pill{
    border:1.5px solid var(--line); background:var(--cream); color:var(--muted2); border-radius:999px;
    padding:5px 11px; font-size:10.5px; font-weight:700; transition:all .15s ease;
  }
  .pill.active{background:var(--herb); color:#fff; border-color:var(--herb); box-shadow:0 2px 6px rgba(18,135,43,0.35);}
  .pill.active.pay{background:var(--yolk); border-color:var(--yolk); color:var(--broth); box-shadow:0 2px 6px rgba(255,199,44,0.45);}

  .ticket-lines{flex:1; overflow-y:auto; padding:12px 20px; font-family:var(--mono); font-size:12.5px;}
  .tline{padding:9px 0; border-bottom:1px dotted var(--line); transition:background .15s ease;}
  .tline:last-child{border-bottom:none;}
  .tline-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .tl-name{flex:1; line-height:1.4;}
  .tl-qtybox{display:flex; align-items:center; gap:7px; margin-top:5px;}
  .qbtn{
    width:20px; height:20px; border:1px solid var(--line); background:var(--panel); border-radius:6px;
    font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; line-height:1; padding:0;
    box-shadow:var(--shadow-sm); transition:transform .1s ease, background .15s ease;
  }
  .qbtn:hover{background:var(--yolk);}
  .qbtn:active{transform:scale(0.88);}
  .tl-amt{font-weight:700; white-space:nowrap;}
  .tl-remove, .tl-note-btn{color:var(--chili); font-size:10.5px; text-decoration:underline; background:none; border:none; padding:0; margin-left:6px; font-family:var(--disp);}
  .tl-note-btn{color:var(--herb-dark);}
  .tl-note{font-size:11px; color:var(--muted2); font-style:italic; margin-top:3px; font-family:var(--disp);}
  .ticket-empty{padding:38px 10px; text-align:center; color:var(--muted2); font-size:13px; font-family:var(--disp);}
  .ticket-empty div:first-child{font-size:28px; margin-bottom:8px;}

  .ticket-totals{padding:12px 20px; font-family:var(--mono); font-size:13px; border-top:1px dashed var(--line); flex-shrink:0;}
  .trow{display:flex; justify-content:space-between; padding:3px 0;}
  .trow.grand{font-size:17px; font-weight:900; border-top:1px dashed var(--line); margin-top:6px; padding-top:9px; color:var(--broth);}
  .trow.disc{color:var(--chili);}
  .discount-toggle{background:none; border:none; color:var(--herb-dark); font-size:11.5px; font-weight:700; text-decoration:underline; padding:4px 0; font-family:var(--disp);}
  .discount-row{display:none; gap:6px; margin:6px 0; align-items:center; font-family:var(--disp);}
  .discount-row.show{display:flex;}
  .discount-row select{border:1px solid var(--line); border-radius:8px; padding:6px 7px; font-size:11.5px; background:var(--cream); flex-shrink:0;}
  .discount-row input{width:70px; border:1px solid var(--line); border-radius:8px; padding:6px 7px; font-size:12px; font-family:var(--mono); background:var(--cream);}
  .cash-row{display:flex; gap:8px; align-items:center; margin-top:9px;}
  .cash-row input{
    flex:1; font-family:var(--mono); font-size:13px; border:1.5px solid var(--line); border-radius:9px;
    padding:9px 10px; background:var(--cream); color:var(--broth); transition:border-color .15s ease;
  }
  .cash-row input:focus{border-color:var(--chili);}
  .quick-cash{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .qc-btn{
    flex:1; min-width:50px; background:var(--panel); border:1.5px solid var(--line); border-radius:8px;
    padding:7px 4px; font-family:var(--mono); font-weight:700; font-size:12px; color:var(--broth);
    transition:transform .1s ease, background .15s ease, border-color .15s ease; box-shadow:var(--shadow-sm);
  }
  .qc-btn:hover{border-color:var(--herb); background:#EAF7EC;}
  .qc-btn:active{transform:scale(0.92);}
  .qc-btn.exact{background:var(--herb); color:#fff; border-color:var(--herb); flex-basis:70px;}
  .qc-btn.clear{flex:0 0 auto; min-width:34px; color:var(--chili); border-color:var(--chili);}
  .change-line{font-weight:800; color:var(--herb-dark);}
  .change-line.short{color:var(--chili);}

  .ticket-actions{padding:12px 20px 18px; display:flex; flex-direction:column; gap:9px; flex-shrink:0;}
  .btn{border:none; border-radius:12px; padding:14px; font-weight:800; font-size:14px; letter-spacing:.3px; transition:transform .1s ease, box-shadow .15s ease, opacity .15s ease;}
  .btn-charge{background:linear-gradient(155deg, #D6241F, var(--chili-dark)); color:#fff; box-shadow:0 6px 16px var(--chili-glow);}
  .btn-charge:not(:disabled):hover{box-shadow:0 8px 20px var(--chili-glow); transform:translateY(-1px);}
  .btn-charge:not(:disabled):active{transform:translateY(0) scale(0.98);}
  .btn-charge:disabled{background:#D8C9AE; color:#fff; cursor:not-allowed; box-shadow:none;}
  .btn-ghost{background:transparent; color:var(--muted2); font-size:12px; font-weight:700; padding:4px;}
  .btn-ghost:hover{color:var(--chili);}

  .mobile-cart-btn{display:none;}
  .ticket-close-mobile{display:none;}
  @media(max-width:820px){
    .ticket-close-mobile{
      display:flex; align-items:center; justify-content:center; gap:6px;
      background:var(--broth); color:var(--cream); border:none; border-radius:11px;
      padding:11px; margin:12px 16px 0; font-size:12.5px; font-weight:700;
    }
    .ticket-col{
      position:fixed; right:0; top:0; bottom:0; width:88vw; max-width:380px;
      transform:translateX(100%); transition:transform .25s cubic-bezier(.25,.8,.4,1); z-index:40;
      box-shadow:-10px 0 30px rgba(0,0,0,0.3);
    }
    .ticket-col.open{transform:translateX(0);}
    .mobile-cart-btn{
      display:flex; position:fixed; right:16px; bottom:16px; z-index:30;
      background:linear-gradient(155deg, #D6241F, var(--chili-dark)); color:#fff; border:none; border-radius:999px; padding:15px 20px;
      font-weight:800; font-size:13px; align-items:center; gap:8px; box-shadow:0 10px 24px rgba(193,57,43,0.45);
      transition:transform .12s ease;
    }
    .mobile-cart-btn:active{transform:scale(0.95);}
    .grid-wrap{padding-bottom:112px;}
  }

  /* ---------- MODALS ---------- */
  .overlay{position:fixed; inset:0; background:rgba(28,17,8,0.6); backdrop-filter:blur(2px); display:none; align-items:center; justify-content:center; z-index:100; padding:20px;}
  .overlay.show{display:flex; animation:fadeIn .18s ease;}
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
  .modal{
    background:var(--panel); border-radius:var(--radius-lg); width:100%; max-width:580px; max-height:85vh;
    display:flex; flex-direction:column; overflow:hidden; box-shadow:var(--shadow-lg);
    animation:modalPop .2s cubic-bezier(.25,.8,.4,1);
  }
  @keyframes modalPop{from{opacity:0; transform:translateY(10px) scale(0.98);} to{opacity:1; transform:translateY(0) scale(1);}}
  .modal-head{
    display:flex; justify-content:space-between; align-items:center; padding:18px 22px;
    border-bottom:1px solid var(--line); flex-shrink:0; background:var(--panel-soft);
  }
  .btn-refresh{
    background:var(--yolk); color:var(--broth); border:1.5px solid var(--broth);
    border-radius:9px; padding:7px 12px; font-family:var(--disp); font-weight:800;
    font-size:12.5px; cursor:pointer; transition:transform .15s;
  }
  .btn-refresh:active{transform:scale(.94);}
  .btn-refresh.spinning{animation:spin .6s linear;}
  @keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  .modal-head h2{margin:0; font-size:16.5px; font-weight:900; letter-spacing:.2px;}
  .modal-close{background:none; border:none; font-size:20px; color:var(--muted2); line-height:1; transition:color .15s ease;}
  .modal-close:hover{color:var(--chili);}
  .modal-body{padding:20px 22px;overflow-y:auto;}

  .menu-row{display:flex; gap:6px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); flex-wrap:wrap;}
  .menu-row input[type=text], .menu-row input[type=number]{
    border:1px solid var(--line); border-radius:9px; padding:7px 9px; font-size:13px; font-family:var(--disp); background:var(--cream);
  }
  .menu-row .m-name{flex:1; min-width:110px;}
  .menu-row .m-note{flex:1; min-width:110px; font-size:12px;}
  .menu-row .m-price{width:72px; font-family:var(--mono);}
  .menu-row .m-del{background:none; border:none; color:var(--chili); font-size:18px; padding:2px 6px; transition:transform .12s ease;}
  .menu-row .m-del:hover{transform:scale(1.15);}
  .m-soldout{display:flex; align-items:center; gap:4px; font-size:10.5px; color:var(--muted2); white-space:nowrap;}
  .cat-block{margin-bottom:20px;}
  .cat-block h3{font-size:12px; text-transform:uppercase; letter-spacing:1.2px; color:var(--muted2); margin:0 0 7px; font-weight:800;}
  .add-item-row{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
  .add-item-row input{flex:1; min-width:90px;}
  .small-btn{background:var(--herb); color:#fff; border:none; border-radius:9px; padding:8px 13px; font-size:12px; font-weight:700; transition:transform .12s ease;}
  .small-btn:active{transform:scale(0.94);}
  .small-btn.alt{background:var(--broth);}
  .cat-add{display:flex; gap:8px; margin-top:16px; padding-top:12px; border-top:1px dashed var(--line);}
  .cat-add input{flex:1;}

  .hist-item{padding:13px 0; border-bottom:1px solid var(--line);}
  .hist-item.voided{opacity:0.5;}
  .hist-item:last-child{border-bottom:none;}
  .hist-top{display:flex; justify-content:space-between; font-family:var(--mono); font-size:11.5px; color:var(--muted2); flex-wrap:wrap; gap:4px;}
  .hist-tags{display:flex; gap:5px; margin-top:4px; flex-wrap:wrap;}
  .hist-tag{background:var(--cream); border-radius:6px; padding:2px 8px; font-size:10px; font-weight:700; color:var(--muted2);}
  .hist-lines{font-size:13px; margin:7px 0; line-height:1.5;}
  .hist-cash{font-family:var(--mono); font-size:11.5px; color:var(--muted2); margin-bottom:6px;}
  .hist-bottom{display:flex; justify-content:space-between; align-items:center;}
  .hist-total{font-weight:800; font-family:var(--mono);}
  .void-btn{background:none; border:none; color:var(--chili); font-size:11px; font-weight:700; text-decoration:underline;}
  .voided-tag{color:var(--chili); font-weight:800; font-size:11px; text-transform:uppercase;}
  .day-summary{
    background:linear-gradient(155deg, #FFF3D6, var(--cream)); border:1px solid var(--line-soft);
    border-radius:var(--radius); padding:15px 17px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center;
    box-shadow:var(--shadow-sm);
  }
  .day-summary .amt{font-family:var(--mono); font-size:21px; font-weight:900; color:var(--herb-dark);}
  .day-summary .lbl{font-size:12px; color:var(--muted2); text-transform:uppercase; letter-spacing:.5px; font-weight:700;}
  .export-bar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
  .export-bar select{border:1px solid var(--line); border-radius:9px; padding:8px 10px; font-size:12.5px; background:var(--panel); color:var(--broth); font-family:var(--disp);}
  .danger-link{color:var(--chili); background:none; border:none; font-size:12px; font-weight:700; text-decoration:underline;}
  .empty-hist{text-align:center; padding:40px 10px; color:var(--muted2); font-size:13px;}

  .chart-wrap{margin-bottom:20px;}
  .chart-title{font-size:12px; text-transform:uppercase; letter-spacing:1.2px; color:var(--muted2); margin-bottom:9px; font-weight:800;}

  /* pin lock */
  .pin-modal{max-width:300px; text-align:center;}
  .pin-modal .modal-body{padding:28px 24px 26px;}
  .pin-icon{
    font-size:26px; margin:0 auto 10px; width:52px; height:52px; border-radius:50%;
    background:var(--cream); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-sm);
  }
  .pin-modal p{font-size:12.5px; color:var(--muted2); margin:0 0 16px;}
  #pinInput{
    width:100%; text-align:center; letter-spacing:10px; font-family:var(--mono); font-size:22px;
    border:1.5px solid var(--line); border-radius:11px; padding:12px; background:var(--cream); color:var(--broth);
  }
  #pinInput.err{border-color:var(--chili); animation:shake .3s;}
  @keyframes shake{0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);}}
  .pin-error{color:var(--chili); font-size:12px; height:16px; margin-top:8px; font-weight:700;}
  .pin-btns{display:flex; gap:8px; margin-top:16px;}
  .pin-btns .btn-ghost{flex:1; border:1.5px solid var(--line); border-radius:11px;}
  .pin-btns .btn-charge{flex:1;}
  .pin-change-block{margin-top:22px; padding-top:16px; border-top:1px dashed var(--line);}
  .pin-change-block h3{font-size:12px; text-transform:uppercase; letter-spacing:1.2px; color:var(--muted2); margin:0 0 10px; font-weight:800;}
  .pin-change-row{display:flex; gap:8px; flex-wrap:wrap;}
  .pin-change-row input{border:1px solid var(--line); border-radius:9px; padding:8px 10px; font-family:var(--mono); font-size:13px; background:var(--cream); width:110px;}
  .backup-status{font-size:12px; font-weight:700; color:var(--herb-dark); background:#EAF7EC; border-radius:8px; padding:8px 11px;}
  .backup-status.warn{color:var(--chili-dark); background:#FCEBEA;}

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--broth); color:var(--cream); padding:12px 22px; border-radius:999px;
    font-size:13px; font-weight:600; z-index:200; opacity:0; transition:all .25s ease; pointer-events:none;
    box-shadow:var(--shadow-lg);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ---------- OUTDOOR / HIGH-CONTRAST MODE ---------- */
  body.hc-mode{
    --line:#3d2c1a; --muted2:#5b4a30; --cream:#FFFFFF;
    background:#FFFFFF;
  }
  body.hc-mode .item-card{border-width:2.5px;}
  body.hc-mode .item-name{font-size:16.5px;}
  body.hc-mode .item-price{font-size:15.5px; font-weight:800;}
  body.hc-mode .item-note{font-size:12px;}
  body.hc-mode .tab{font-size:14.5px; padding:11px 19px; font-weight:800;}
  body.hc-mode .btn{font-size:16px; padding:16px;}
  body.hc-mode .head-btn{font-size:13.5px; padding:11px 16px;}
  body.hc-mode .qc-btn{font-size:13.5px; padding:9px 6px; font-weight:800;}
  body.hc-mode .tl-name, body.hc-mode .tl-amt{font-size:13.5px;}
  body.hc-mode .trow.grand{font-size:19px;}
</style>
</head>

<script>
/* ================= STORAGE (works standalone, no internet needed) =================
   Uses the phone/browser's own localStorage so this app keeps its data
   even when opened as a plain saved file / home-screen shortcut, fully offline. */
const appStorage = {
  async get(key){
    const v = localStorage.getItem('balutan_'+key);
    return v===null ? null : {key, value:v};
  },
  async set(key, value){
    try{ localStorage.setItem('balutan_'+key, value); return {key, value}; }
    catch(e){ return null; }
  },
  async delete(key){
    localStorage.removeItem('balutan_'+key);
    return {key, deleted:true};
  }
};

/* ================= DEFAULT DATA ================= */
const DEFAULT_MENU = {
  "Balut & Penoy": [
    {id:"b1", name:"Balut Regular", price:20},

    {id:"c1", name:"Balut Combo", price:35, note:"Balut + Atchara + Drink"}

const PAYMENT_METHODS = ["Cash","GCash","Maya"];

let menu = JSON.parse(JSON.stringify(DEFAULT_MENU));
let salesLog = [];
let dayCounter = {date: todayStr(), count: 0};
let securityPin = "1234";
let sheetsUrl = "";
let pendingSync = [];
let activeCategory = null;
let pinResolve = null;

let tickets = [];

let uiLang = 'en';
let lastBackupDate = null;
let inventory = { date: null, counts: {} };

function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }

function newTicket(){
  return {
    id: uid('t'), orderNo: null, lines: [],
    table: "", orderType: "Dine-in", paymentMethod: "Cash",
    discType: "none", discValue: 0, cashInput: ""
  };
}
function ensureOrderNo(t){
  if(t.orderNo !== null) return;
  if(dayCounter.date !== todayStr()){ dayCounter = {date: todayStr(), count:0}; }
  dayCounter.count += 1;
  saveDayCounter();
  t.orderNo = dayCounter.count;
  if(!t.table) t.table = `Order #${t.orderNo}`;
}
/* Every open order tab gets its order number the moment it's created */
function createTicketWithOrderNo(){
  const t = newTicket();
  ensureOrderNo(t);
  return t;
}
function activeTicket(){ return tickets.find(t=>t.id===activeTicketId) || tickets[0]; }

/* ================= STORAGE ================= */
async function loadData(){
  try{ const m = await appStorage.get('menu'); if(m && m.value) menu = JSON.parse(m.value); }catch(e){}
  try{ const s = await appStorage.get('salesLog'); if(s && s.value) salesLog = JSON.parse(s.value); }catch(e){}
  try{ const p = await appStorage.get('securityPin'); if(p && p.value) securityPin = p.value; }catch(e){}
  try{ const dc = await appStorage.get('dayCounter'); if(dc && dc.value){ const parsed = JSON.parse(dc.value); if(parsed.date===todayStr()) dayCounter = parsed; } }catch(e){}
  try{ const su = await appStorage.get('sheetsUrl'); if(su && su.value) sheetsUrl = su.value; }catch(e){}
  try{ const ps = await appStorage.get('pendingSync'); if(ps && ps.value) pendingSync = JSON.parse(ps.value); }catch(e){}
  try{ const hc = await appStorage.get('highContrast'); if(hc && hc.value==='1'){ highContrast = true; document.body.classList.add('hc-mode'); } }catch(e){}
  try{ const lang = await appStorage.get('uiLang'); if(lang && lang.value){ uiLang = lang.value; } }catch(e){}
  try{ const lb = await appStorage.get('lastBackupDate'); if(lb && lb.value) lastBackupDate = lb.value; }catch(e){}
  try{ const inv = await appStorage.get('inventory'); if(inv && inv.value) inventory = JSON.parse(inv.value); }catch(e){}

  try{
    const ot = await appStorage.get('openTickets');
    if(ot && ot.value){
      const parsed = JSON.parse(ot.value);
      if(parsed.tickets && parsed.tickets.length){
        tickets = parsed.tickets;
        tickets.forEach(t => { if(t.orderNo == null) ensureOrderNo(t); });
        activeTicketId = (parsed.activeTicketId && tickets.some(t=>t.id===parsed.activeTicketId))
          ? parsed.activeTicketId : tickets[0].id;
      }
    }
  }catch(e){}
  if(!tickets || tickets.length===0){
    tickets = [createTicketWithOrderNo()];
    activeTicketId = tickets[0].id;
  }

  renderTabs(); renderGrid();
  renderTicketTabs(); renderCart();
  applyStaticLanguage();
  flushPendingSync();
}
async function saveMenu(){ try{ await appStorage.set('menu', JSON.stringify(menu)); }catch(e){ showToast("Menu saved on this device only"); } }
async function saveSales(){ try{ await appStorage.set('salesLog', JSON.stringify(salesLog)); }catch(e){} }
async function savePin(){ try{ await appStorage.set('securityPin', securityPin); }catch(e){ showToast("PIN changed for this session only"); } }
async function saveDayCounter(){ try{ await appStorage.set('dayCounter', JSON.stringify(dayCounter)); }catch(e){} }
async function saveSheetsUrl(){ try{ await appStorage.set('sheetsUrl', sheetsUrl); }catch(e){} }
async function savePendingSync(){ try{ await appStorage.set('pendingSync', JSON.stringify(pendingSync)); }catch(e){} }
async function saveTickets(){ try{ await appStorage.set('openTickets', JSON.stringify({tickets, activeTicketId})); }catch(e){} }
async function saveHighContrast(){ try{ await appStorage.set('highContrast', highContrast ? '1' : '0'); }catch(e){} }
async function saveUiLang(){ try{ await appStorage.set('uiLang', uiLang); }catch(e){} }
async function saveLastBackupDate(){ try{ await appStorage.set('lastBackupDate', lastBackupDate); }catch(e){} }
async function saveInventory(){ try{ await appStorage.set('inventory', JSON.stringify(inventory)); }catch(e){} }

function i18n(key){ const e = LANG[key]; if(!e) return key; return e[uiLang] || e.en; }
function applyStaticLanguage(){
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = i18n(el.getAttribute('data-i18n')); });
}
function setLanguage(lang){
  uiLang = lang;
  saveUiLang();
  applyStaticLanguage();
  renderGrid(); renderCart(); renderAppSettings();
}

/* ================= BACKUP & RESTORE ================= */
function getBackupInfo(){
  if(!lastBackupDate) return {text:"⚠️ Never backed up — download one now", warn:true};
  const days = Math.floor((Date.now() - new Date(lastBackupDate).getTime()) / 86400000);
  if(days <= 0) return {text:"✅ Backed up today", warn:false};
  if(days === 1) return {text:"Last backup: 1 day ago", warn:false};
  if(days <= 3) return {text:`Last backup: ${days} days ago`, warn:false};
  return {text:`⚠️ Last backup: ${days} days ago — back up again soon`, warn:true};
}
function downloadBackup(){
  const backup = {
    menu, salesLog, dayCounter, sheetsUrl, securityPin, pendingSync,
    tickets, activeTicketId, inventory,
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const stamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}`;
  a.href = url; a.download = `balutan-backup-${stamp}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  lastBackupDate = new Date().toISOString();
  saveLastBackupDate();
  renderAppSettings();
  showToast("Backup downloaded ✓");
}
function triggerRestoreFile(){ document.getElementById('restoreFileInput').click(); }
function restoreFromFile(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      if(!data.menu || !data.salesLog){ showToast("That file doesn't look like a valid backup"); return; }
      if(!confirm("Restore this backup? This will replace your current menu, sales history, and settings on this device.")) return;
      menu = data.menu || menu;
      salesLog = data.salesLog || salesLog;
      dayCounter = data.dayCounter || dayCounter;
      sheetsUrl = data.sheetsUrl || sheetsUrl;
      securityPin = data.securityPin || securityPin;
      pendingSync = data.pendingSync || pendingSync;
      inventory = data.inventory || inventory;
      tickets = (data.tickets && data.tickets.length) ? data.tickets : tickets;
      activeTicketId = data.activeTicketId || (tickets[0] && tickets[0].id);
      saveMenu(); saveSales(); saveDayCounter(); saveSheetsUrl(); savePin(); savePendingSync(); saveTickets(); saveInventory();
      activeCategory = null;
      renderTabs(); renderGrid(); renderTicketTabs(); renderCart(); renderAppSettings();
      showToast("Backup restored ✓");
    }catch(err){
      showToast("Couldn't read that backup file");
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

/* ================= DAILY INVENTORY ================= */
function soldQtyForItem(itemId, itemName){
  const today = new Date().toDateString();
  let sold = 0;
  salesLog.forEach(o=>{
    if(o.voided) return;
    if(new Date(o.time).toDateString() !== today) return;
    o.lines.forEach(l=>{
      if((l.id && l.id===itemId) || (!l.id && l.name===itemName)) sold += l.qty;
    });
  });
  return sold;
}
function openInventory(){ renderInventory(); document.getElementById('inventoryOverlay').classList.add('show'); }
function renderInventory(){
  const body = document.getElementById('inventoryBody');
  const isToday = inventory.date === todayStr();
  let html = '';
  html += isToday
    ? `<div class="backup-status" style="margin-bottom:14px;">✅ Today's inventory is set. Stock updates automatically as sales come in.</div>`
    : `<div class="backup-status warn" style="margin-bottom:14px;">⚠️ You haven't set today's inventory yet. Enter starting counts below, then tap Save to begin the day.</div>`;

  let anyItems = false;
  for(const cat in menu){
    const items = menu[cat];
    if(!items.length) continue;
    anyItems = true;
    html += `<div class="cat-block"><h3>${escapeHtml(cat)}</h3>`;
    items.forEach(it=>{
      const rawCount = isToday ? inventory.counts[it.id] : undefined;
      const hasCount = rawCount !== undefined && rawCount !== null && rawCount !== '';
      const sold = hasCount ? soldQtyForItem(it.id, it.name) : 0;
      const remaining = hasCount ? (Number(rawCount) - sold) : null;
      html += `<div class="menu-row">
        <div class="m-name" style="flex:1; min-width:110px; font-weight:700;">${escapeHtml(it.name)}</div>
        <input type="number" min="0" class="m-price inv-qty" style="width:70px;" data-item="${it.id}" placeholder="Qty" value="${hasCount ? rawCount : ''}">
        ${hasCount
          ? `<span style="font-size:11.5px; color:var(--muted2); white-space:nowrap;">Sold ${sold} · Left <strong style="color:${remaining<=0?'var(--chili)':'var(--herb-dark)'}">${remaining}</strong></span>`
          : `<span style="font-size:11px; color:var(--muted2);">Not set</span>`}
      </div>`;
    });
    html += `</div>`;
  }
  if(!anyItems){
    html += `<div class="empty-hist">Add items in the Menu editor first, then set today's inventory here.</div>`;
  }
  html += `<div style="display:flex; gap:8px; margin-top:6px; flex-wrap:wrap;">
    <button class="small-btn" onclick="saveTodayInventory()">💾 Save Inventory for Today</button>
    <button class="danger-link" onclick="clearTodayInventory()">Clear today's inventory</button>
  </div>`;
  body.innerHTML = html;
}
function saveTodayInventory(){
  const inputs = document.querySelectorAll('.inv-qty');
  const counts = {};
  inputs.forEach(inp=>{
    const val = inp.value;
    if(val !== '' && !isNaN(val)) counts[inp.getAttribute('data-item')] = Number(val);
  });
  inventory = { date: todayStr(), counts };
  saveInventory();
  renderInventory();
  showToast("Today's inventory saved ✓");
  syncInventorySnapshot();
}
function clearTodayInventory(){
  if(!confirm("Clear today's inventory counts? You'll need to re-enter them.")) return;
  inventory = { date: null, counts: {} };
  saveInventory();
  renderInventory();
  showToast("Inventory cleared");
}

/* ================= HELPERS ================= */
function peso(n){ return "₱" + n.toFixed(2); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}
function uid(prefix){ return prefix + Math.random().toString(36).slice(2,8); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ================= MENU / GRID ================= */
function renderTabs(){
  const cats = Object.keys(menu);
  const hasFav = cats.some(c => (menu[c]||[]).some(it=>it.fav));
  const tabList = hasFav ? ['__fav__', ...cats] : cats;
  if(!activeCategory || !tabList.includes(activeCategory)) activeCategory = tabList[0] || null;
  document.getElementById('tabs').innerHTML = tabList.map(c =>
    c === '__fav__'
      ? `<button class="tab tab-fav ${c===activeCategory?'active':''}" onclick="selectCategory('__fav__')">⭐ Top Picks</button>`
      : `<button class="tab ${c===activeCategory?'active':''}" onclick="selectCategory('${c.replace(/'/g,"\\'")}')">${escapeHtml(c)}</button>`
  ).join('');
}
function selectCategory(c){ activeCategory = c; renderTabs(); renderGrid(); }

function renderGrid(){
  const grid = document.getElementById('grid');
  let items;
  if(activeCategory === '__fav__'){
    items = [];
    for(const cat in menu){ (menu[cat]||[]).forEach(it => { if(it.fav) items.push(it); }); }
  }else{
    items = activeCategory ? (menu[activeCategory]||[]) : [];
    items = [...items].sort((a,b) => (b.fav?1:0) - (a.fav?1:0));
  }
  if(items.length===0){
    grid.innerHTML = `<div class="empty-menu">${i18n('noItemsCat')}</div>`;
    return;
  }
  grid.innerHTML = items.map(it => `
    <button class="item-card ${it.soldOut?'soldout':''}" onclick="addToCart('${it.id}')" ${it.soldOut?'disabled':''}>
      ${it.fav ? '<span class="fav-badge">⭐</span>' : ''}
      ${it.soldOut ? `<span class="soldout-badge">${i18n('soldOut')}</span>` : '<span class="plus">+</span>'}
      <span class="item-name">${escapeHtml(it.name)}</span>
      ${it.note ? `<span class="item-note">${escapeHtml(it.note)}</span>` : ''}
      <span class="item-price">${peso(it.price)}</span>
    </button>
  `).join('');
}

/* ================= TICKET TABS ================= */
function renderTicketTabs(){
  const wrap = document.getElementById('ticketTabs');
  wrap.innerHTML = tickets.map(t => `
    <button class="tticket-tab ${t.id===activeTicketId?'active':''}" onclick="switchTicket('${t.id}')">
      ${escapeHtml(t.table) || `#${t.orderNo}`} <span class="cnt">${t.lines.reduce((s,l)=>s+l.qty,0)}</span>
      ${tickets.length>1 ? `<span class="ticket-tab-close" onclick="event.stopPropagation(); closeTicket('${t.id}')">✕</span>` : ''}
    </button>
  `).join('') + `<button class="ticket-tab-add" onclick="addTicket()">+</button>` + (tickets.length>1 ? `<button class="ticket-tab-clear" onclick="clearAllTickets()" title="Remove all order tabs">🗑</button>` : '');
  saveTickets();
}
function onTableInput(){
  activeTicket().table = document.getElementById('tableInput').value;
  renderTicketTabs();
}
function addTicket(){
  const t = createTicketWithOrderNo();
  tickets.push(t);
  activeTicketId = t.id;
  renderTicketTabs(); renderCart();
}
function switchTicket(id){ activeTicketId = id; renderTicketTabs(); renderCart(); }
function clearAllTickets(){
  const withItems = tickets.filter(t=>t.lines.length>0).length;
  const msg = withItems>0
    ? `Remove all ${tickets.length} order tabs, including ${withItems} with items still on them? This can't be undone.`
    : `Remove all ${tickets.length} empty order tabs and start fresh?`;
  requirePin(function(){
    if(!confirm(msg)) return;
    tickets = [createTicketWithOrderNo()];
    activeTicketId = tickets[0].id;
    renderTicketTabs(); renderCart();
    showToast("All order tabs cleared");
  });
}
function closeTicket(id){
  const t = tickets.find(x=>x.id===id);
  if(t && t.lines.length>0 && !confirm("This order has items. Discard it?")) return;
  tickets = tickets.filter(x=>x.id!==id);
  if(tickets.length===0){ tickets = [createTicketWithOrderNo()]; }
  if(activeTicketId===id) activeTicketId = tickets[0].id;
  renderTicketTabs(); renderCart();
}

/* ================= CART ================= */
function addToCart(id){
  let item = null;
  for(const cat in menu){ const f = menu[cat].find(x=>x.id===id); if(f){item=f; break;} }
  if(!item || item.soldOut) return;
  const t = activeTicket();
  ensureOrderNo(t);
  const existing = t.lines.find(l=>l.id===id);
  if(existing) existing.qty += 1;
  else t.lines.push({id:item.id, name:item.name, price:item.price, qty:1, note:""});
  renderCart(); renderTicketTabs();
  if(window.innerWidth <= 820) showToast(`+ ${item.name}`);
}
function changeQty(id, delta){
  const t = activeTicket();
  const line = t.lines.find(l=>l.id===id);
  if(!line) return;
  line.qty += delta;
  if(line.qty <= 0) t.lines = t.lines.filter(l=>l.id!==id);
  renderCart(); renderTicketTabs();
}
function removeLine(id){ const t=activeTicket(); t.lines = t.lines.filter(l=>l.id!==id); renderCart(); renderTicketTabs(); }
function editNote(id){
  const t = activeTicket();
  const line = t.lines.find(l=>l.id===id);
  if(!line) return;
  const val = prompt("Note for " + line.name + " (e.g. no onions, extra spicy):", line.note || "");
  if(val !== null){ line.note = val.trim(); renderCart(); }
}
function clearOrder(){
  const t = activeTicket();
  t.lines = []; t.discType = "none"; t.discValue = 0; t.cashInput = "";
  document.getElementById('cashInput').value = '';
  renderCart(); renderTicketTabs();
}

function setPaymentMethod(pm){ activeTicket().paymentMethod = pm; renderCart(); }
function toggleDiscountRow(){
  const row = document.getElementById('discountRow');
  row.classList.toggle('show');
}
function onDiscTypeChange(){
  const t = activeTicket();
  t.discType = document.getElementById('discType').value;
  if(t.discType === 'senior'){ document.getElementById('discValue').value = 20; document.getElementById('discValue').disabled = true; }
  else{ document.getElementById('discValue').disabled = false; }
  renderTotals();
}

function cartSubtotal(t){ return t.lines.reduce((s,l)=>s+l.price*l.qty,0); }
function calcDiscount(t, subtotal){
  if(t.discType === 'percent') return subtotal * (t.discValue/100 || 0);
  if(t.discType === 'senior') return subtotal * 0.20;
  if(t.discType === 'fixed') return Math.min(t.discValue||0, subtotal);
  return 0;
}

function renderCart(){
  const t = activeTicket();
  const wrap = document.getElementById('ticketLines');
  const count = t.lines.reduce((s,l)=>s+l.qty,0);
  document.getElementById('mobCount').textContent = tickets.reduce((s,tk)=>s+tk.lines.reduce((a,l)=>a+l.qty,0),0);
  document.getElementById('tableInput').value = t.table || '';
  document.getElementById('orderMeta').textContent = count>0 ? `${count} item${count>1?'s':''}` : i18n('noItemsYet');

  document.getElementById('paymentPills').innerHTML = PAYMENT_METHODS.map(pm =>
    `<button class="pill ${t.paymentMethod===pm?'active pay':''}" onclick="setPaymentMethod('${pm}')">${pm}</button>`
  ).join('');
  document.getElementById('cashRow').style.display = t.paymentMethod==='Cash' ? 'flex' : 'none';
  document.getElementById('quickCash').style.display = t.paymentMethod==='Cash' ? 'flex' : 'none';

  document.getElementById('discType').value = t.discType;
  document.getElementById('discValue').value = t.discValue || '';
  document.getElementById('discValue').disabled = (t.discType==='senior');
  if(t.discType !== 'none') document.getElementById('discountRow').classList.add('show');

  if(t.lines.length===0){
    wrap.innerHTML = `<div class="ticket-empty"><div>🍜</div>${i18n('emptyCartLine1')}<br>${i18n('emptyCartLine2')}</div>`;
  }else{
    wrap.innerHTML = t.lines.map(l => `
      <div class="tline">
        <div class="tline-top">
          <div class="tl-name">
            ${escapeHtml(l.name)}
            <div class="tl-qtybox">
              <button class="qbtn" onclick="changeQty('${l.id}',-1)">–</button>
              <span>${l.qty}</span>
              <button class="qbtn" onclick="changeQty('${l.id}',1)">+</button>
              <button class="tl-note-btn" onclick="editNote('${l.id}')">${i18n('noteBtn')}</button>
              <button class="tl-remove" onclick="removeLine('${l.id}')">${i18n('removeBtn')}</button>
            </div>
            ${l.note ? `<div class="tl-note">"${escapeHtml(l.note)}"</div>` : ''}
          </div>
          <div class="tl-amt">${peso(l.price*l.qty)}</div>
        </div>
      </div>
    `).join('');
  }
  renderTotals();
}
function addQuickCash(amt){
  const input = document.getElementById('cashInput');
  const cur = parseFloat(input.value) || 0;
  const next = cur + amt;
  input.value = Number.isInteger(next) ? next : next.toFixed(2);
  renderTotals();
}
function setExactCash(){
  const t = activeTicket();
  const subtotal = cartSubtotal(t);
  const discount = calcDiscount(t, subtotal);
  const total = Math.max(subtotal - discount, 0);
  const input = document.getElementById('cashInput');
  input.value = Number.isInteger(total) ? total : total.toFixed(2);
  renderTotals();
}
function clearCash(){
  document.getElementById('cashInput').value = '';
  renderTotals();
}

function renderTotals(){
  const t = activeTicket();
  t.discValue = parseFloat(document.getElementById('discValue').value) || 0;
  t.cashInput = document.getElementById('cashInput').value;

  const subtotal = cartSubtotal(t);
  const discount = calcDiscount(t, subtotal);
  const total = Math.max(subtotal - discount, 0);

  document.getElementById('subtotal').textContent = peso(subtotal);
  const discRow = document.getElementById('discRow');
  if(discount > 0){
    discRow.style.display = 'flex';
    document.getElementById('discLbl').textContent = t.discType==='senior' ? 'Senior/PWD (20%)' : t.discType==='percent' ? `${i18n('discountWord')} (${t.discValue}%)` : i18n('discountWord');
    document.getElementById('discAmt').textContent = '-' + peso(discount);
  }else{ discRow.style.display = 'none'; }
  document.getElementById('grandTotal').textContent = peso(total);

  const changeRow = document.getElementById('changeRow');
  const chargeBtn = document.getElementById('chargeBtn');
  if(t.paymentMethod === 'Cash'){
    const cashVal = parseFloat(t.cashInput);
    if(!isNaN(cashVal) && t.lines.length>0){
      const change = cashVal - total;
      changeRow.style.display = 'flex';
      document.getElementById('changeLbl').textContent = change >= 0 ? i18n('change') : i18n('shortBy');
      document.getElementById('changeAmt').textContent = peso(Math.abs(change));
      changeRow.classList.toggle('short', change < 0);
      chargeBtn.disabled = change < 0 || t.lines.length===0;
    }else{
      changeRow.style.display = 'none';
      chargeBtn.disabled = t.lines.length===0;
    }
  }else{
    changeRow.style.display = 'none';
    chargeBtn.disabled = t.lines.length===0;
  }
}

/* ================= CHECKOUT ================= */
function completeOrder(){
  const t = activeTicket();
  if(t.lines.length===0) return;
  ensureOrderNo(t);
  const subtotal = cartSubtotal(t);
  const discount = calcDiscount(t, subtotal);
  const total = Math.max(subtotal - discount, 0);
  const cashVal = parseFloat(t.cashInput);
  const cash = (t.paymentMethod==='Cash') ? (isNaN(cashVal) ? total : cashVal) : total;
  const change = (t.paymentMethod==='Cash') ? (cash - total) : 0;

  const order = {
    id: uid('ord'), orderNo: t.orderNo, table: t.table || "", time: new Date().toISOString(),
    lines: t.lines.map(l=>({id:l.id, name:l.name, qty:l.qty, price:l.price, note:l.note||""})),
    orderType: t.orderType, paymentMethod: t.paymentMethod,
    subtotal, discount, total, cash, change, voided:false
  };
  salesLog.unshift(order);
  saveSales();
  syncOrder(order);

  tickets = tickets.filter(x=>x.id!==t.id);
  if(tickets.length===0) tickets = [createTicketWithOrderNo()];
  activeTicketId = tickets[0].id;
  renderTicketTabs(); renderCart();
  showToast(`Order #${order.orderNo} completed ✓`);
}

function requirePin(onSuccess){
  pinResolve = onSuccess;
  const input = document.getElementById('pinInput');
  input.value = ''; input.classList.remove('err');
  document.getElementById('pinError').textContent = '';
  document.getElementById('pinOverlay').classList.add('show');
  setTimeout(()=>input.focus(), 50);
}
function cancelPin(){ pinResolve = null; document.getElementById('pinOverlay').classList.remove('show'); }
function submitPin(){
  const input = document.getElementById('pinInput');
  if(input.value === securityPin){
    document.getElementById('pinOverlay').classList.remove('show');
    const fn = pinResolve; pinResolve = null;
    if(fn) fn();
  }else{
    input.classList.remove('err'); void input.offsetWidth; input.classList.add('err');
    document.getElementById('pinError').textContent = 'Incorrect PIN, try again';
    input.value = ''; input.focus();
  }
}
document.addEventListener('keydown', (e)=>{
  if(document.getElementById('pinOverlay').classList.contains('show') && e.key==='Enter') submitPin();
});

function cssSafe(s){ return s.replace(/[^a-z0-9]/gi,''); }

  if(!item) return;
  item[field] = field==='price' ? (parseFloat(value)||0) : value;
  saveMenu(); renderGrid();
  if(field==='fav') renderTabs();
}
function deleteItem(cat, id){ menu[cat] = menu[cat].filter(i=>i.id!==id); saveMenu(); renderMenuEditor(); renderGrid(); }
function addItem(cat){
  const nameEl = document.getElementById('newname-'+cssSafe(cat));

function deleteCategory(cat){

  saveMenu(); renderMenuEditor(); renderTabs(); renderGrid();
}
function addCategory(){

async function refreshHistory(){
  const btn = document.getElementById('historyRefreshBtn');
  if(btn) btn.classList.add('spinning');
  try{
    const s = await appStorage.get('salesLog');
    salesLog = (s && s.value) ? JSON.parse(s.value) : [];
  }catch(e){}
  renderHistory();
  if(btn){
    setTimeout(()=>btn.classList.remove('spinning'), 600);
  }
  showToast("Sales refreshed");
}
function renderHistory(){
  const body = document.getElementById('historyBody');
  const today = new Date().toDateString();
  const todaysOrders = salesLog.filter(o => !o.voided && new Date(o.time).toDateString()===today);
  const todayTotal = todaysOrders.reduce((s,o)=>s+o.total,0);

  let html = `<div class="export-bar">
    <select id="exportRange">
      <option value="today">Today</option>
      <option value="7days">Last 7 days</option>
      <option value="30days">Last 30 days</option>
      <option value="all">All time</option>
    </select>
    <button class="small-btn" onclick="exportOrdersCSV()">⬇ Orders CSV</button>
    <button class="small-btn alt" onclick="exportItemSummaryCSV()">⬇ Item Summary CSV</button>
  </div>`;

  html += `<div class="day-summary">
    <div><div class="lbl">Today's Sales</div><div class="amt">${peso(todayTotal)}</div></div>
    <div style="text-align:right"><div class="lbl">Orders</div><div class="amt">${todaysOrders.length}</div></div>
  </div>`;

  html += renderChart();

  if(salesLog.length===0){
    html += `<div class="empty-hist">No completed orders yet.</div>`;
  }else{
    html += salesLog.slice(0,150).map(o => {
      const d = new Date(o.time);
      const linesStr = o.lines.map(l=>`${l.qty}× ${escapeHtml(l.name)}${l.note?` (${escapeHtml(l.note)})`:''}`).join(', ');
      return `<div class="hist-item ${o.voided?'voided':''}">
        <div class="hist-top"><span>#${o.orderNo}${(o.table && o.table !== `Order #${o.orderNo}`) ? ' · '+escapeHtml(o.table) : ''} · ${d.toLocaleDateString()} ${d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span></div>
        <div class="hist-tags">
          <span class="hist-tag">${escapeHtml(o.orderType||'Dine-in')}</span>
          <span class="hist-tag">${escapeHtml(o.paymentMethod||'Cash')}</span>
          ${o.discount>0 ? `<span class="hist-tag">-${peso(o.discount)} disc</span>` : ''}
        </div>
        <div class="hist-lines">${linesStr}</div>
        ${(!o.voided && o.paymentMethod==='Cash') ? `<div class="hist-cash">Cash ${peso(o.cash)} · Change ${peso(Math.max(o.change,0))}</div>` : ''}
        <div class="hist-bottom">
          ${o.voided ? '<span class="voided-tag">Voided</span>' : `<button class="void-btn" onclick="requirePin(function(){voidOrder('${o.id}')})">🔒 Void</button>`}
          <div class="hist-total">${peso(o.total)}</div>
        </div>
      </div>`;
    }).join('');
    html += `<div style="text-align:center; margin-top:14px;"><button class="danger-link" onclick="requirePin(clearHistory)">🔒 Clear all sales history</button></div>`;
  }
  body.innerHTML = html;
}

function voidOrder(id){
  const o = salesLog.find(x=>x.id===id);
  if(!o) return;
  if(!confirm(`Void order #${o.orderNo} for ${peso(o.total)}? It will be excluded from totals and reports.`)) return;
  o.voided = true;
  saveSales(); renderHistory();
  showToast(`Order #${o.orderNo} voided`);
}
function clearHistory(){
  if(!confirm("Clear all sales history? This can't be undone.")) return;
  salesLog = []; saveSales(); renderHistory();
}

function renderChart(){
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    days.push(d);
  }
  const totals = days.map(d => salesLog.filter(o=>!o.voided && new Date(o.time).toDateString()===d.toDateString()).reduce((s,o)=>s+o.total,0));
  const max = Math.max(...totals, 1);
  const w = 500, h = 120, barW = w/7 - 10;
  let bars = '';
  days.forEach((d,i)=>{
    const barH = (totals[i]/max) * (h-24);
    const x = i * (w/7) + 5;
    const y = h - barH - 18;
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="4" fill="${i===6?'#C1392B':'#E3A339'}"/>`;
    bars += `<text x="${x+barW/2}" y="${h-4}" font-size="9" text-anchor="middle" fill="#9C8E76" font-family="ui-monospace,monospace">${d.toLocaleDateString([], {weekday:'short'})}</text>`;
  });
  return `<div class="chart-wrap"><div class="chart-title">Last 7 Days</div>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto;">${bars}</svg>
  </div>`;
}

/* ================= GOOGLE SHEETS SYNC ================= */
function saveSheetsUrlFromInput(){
  const val = document.getElementById('sheetsUrlInput').value.trim();
  sheetsUrl = val;
  saveSheetsUrl();
  showToast(val ? "Sync URL saved" : "Sync URL cleared");
  flushPendingSync();
}
async function syncOrder(order){
  if(!sheetsUrl) return;
  try{
    await fetch(sheetsUrl, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({type:'sale', order})
    });
    // no-cors means we can't read the response, so this is best-effort/optimistic
  }catch(e){
    if(!pendingSync.find(o=>o.id===order.id)){
      pendingSync.push(order);
      savePendingSync();
    }
  }
}
async function syncInventorySnapshot(){
  if(!sheetsUrl || !inventory.date) return;
  const items = [];
  for(const cat in menu){
    (menu[cat]||[]).forEach(it=>{
      const raw = inventory.counts[it.id];
      if(raw === undefined || raw === null || raw === '') return;
      const sold = soldQtyForItem(it.id, it.name);
      items.push({
        category: cat, name: it.name,
        startQty: Number(raw), sold, remaining: Number(raw) - sold
      });
    });
  }
  if(items.length===0) return;
  try{
    await fetch(sheetsUrl, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({type:'inventory', date: inventory.date, items})
    });
  }catch(e){
    // Inventory sync is best-effort only — not queued for retry like sales
  }
}
async function flushPendingSync(){
  if(sheetsUrl) syncInventorySnapshot();
  if(!sheetsUrl || pendingSync.length===0){ updateSyncLabel(); return; }
  const queue = pendingSync.slice();
  pendingSync = [];
  savePendingSync();
  for(const order of queue){ await syncOrder(order); }
  updateSyncLabel();
  showToast(pendingSync.length===0 ? "All sales synced ✓" : `${pendingSync.length} order(s) still pending`);
}
function updateSyncLabel(){
  const lbl = document.getElementById('syncStatusLbl');
  if(lbl) lbl.textContent = pendingSync.length>0 ? `${pendingSync.length} order(s) waiting to sync` : 'All synced';
}
window.addEventListener('online', flushPendingSync);

function getRangeOrders(){
  const range = document.getElementById('exportRange')?.value || 'today';
  const now = new Date();
  let cutoff = null;
  if(range === 'today') cutoff = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  else if(range === '7days') cutoff = new Date(now.getTime() - 7*24*60*60*1000);
  else if(range === '30days') cutoff = new Date(now.getTime() - 30*24*60*60*1000);
  const orders = (cutoff ? salesLog.filter(o => new Date(o.time) >= cutoff) : salesLog.slice()).filter(o=>!o.voided);
  return orders.sort((a,b)=> new Date(a.time) - new Date(b.time));
}
function csvCell(v){ const s = String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; }
function downloadCSV(filename, rows){
  const csv = rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  const blob = new Blob(["\uFEFF" + csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function exportOrdersCSV(){
  const orders = getRangeOrders();
  if(orders.length===0){ showToast("No orders in that range"); return; }
  const rows = [["Order #","Table/Priority/Note","Date","Time","Order Type","Payment","Items","Subtotal","Discount","Total","Cash Received","Change"]];
  orders.forEach(o=>{
    const d = new Date(o.time);
    const itemsStr = o.lines.map(l=>`${l.qty}x ${l.name}${l.note?` (${l.note})`:''}`).join('; ');
    rows.push([
      o.orderNo, o.table||'', d.toLocaleDateString(), d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),
      o.orderType||'', o.paymentMethod||'',
      itemsStr, (o.subtotal||o.total).toFixed(2), (o.discount||0).toFixed(2), o.total.toFixed(2),
      o.cash.toFixed(2), Math.max(o.change,0).toFixed(2)
    ]);
  });
  const totalSales = orders.reduce((s,o)=>s+o.total,0);
  rows.push([]);
  rows.push(["", "", "", "", "", "", "TOTAL", "", "", totalSales.toFixed(2), "", ""]);
  downloadCSV(`balutan-orders-${dateStamp()}.csv`, rows);
  showToast("Orders CSV downloaded");
}
function exportItemSummaryCSV(){
  const orders = getRangeOrders();
  if(orders.length===0){ showToast("No orders in that range"); return; }
  const summary = {};
  orders.forEach(o=>{
    o.lines.forEach(l=>{
      if(!summary[l.name]) summary[l.name] = {qty:0, revenue:0};
      summary[l.name].qty += l.qty;
      summary[l.name].revenue += l.qty * l.price;
    });
  });
  const rows = [["Item","Qty Sold","Revenue"]];
  Object.keys(summary).sort((a,b)=>summary[b].qty - summary[a].qty).forEach(name=>{
    rows.push([name, summary[name].qty, summary[name].revenue.toFixed(2)]);
  });
  const totalRevenue = Object.values(summary).reduce((s,v)=>s+v.revenue,0);
  rows.push([]);
  rows.push(["TOTAL", "", totalRevenue.toFixed(2)]);
  downloadCSV(`balutan-item-summary-${dateStamp()}.csv`, rows);
  showToast("Item summary CSV downloaded");
}
function dateStamp(){
  const d = new Date();
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
}

/* ================= CLOCK ================= */
function tickClock(){ document.getElementById('clock').textContent = new Date().toLocaleString([], {weekday:'short', hour:'2-digit', minute:'2-digit'}); }
setInterval(tickClock, 1000); tickClock();

/* ================= INIT ================= */
loadData();
